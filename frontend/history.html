<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal History — AgriNegotiator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .history-container {
      max-width: 1200px;
      margin: var(--sp-10) auto;
      padding: 0 var(--sp-8);
    }
    .history-hero {
      margin-bottom: var(--sp-8);
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
      padding: var(--sp-10);
      border-radius: var(--r-xl);
    }
    .history-hero h1 { font-size: 2.5rem; margin-bottom: var(--sp-2); }
    .history-hero p { font-size: 1.1rem; color: var(--text-secondary); }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .history-entry-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-6);
      display: grid;
      grid-template-columns: 80px 1fr 200px;
      align-items: center;
      gap: var(--sp-6);
      transition: all var(--t-mid);
    }
    .history-entry-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .he-icon {
      width: 60px; height: 60px;
      border-radius: var(--r-md);
      background: rgba(34, 197, 94, 0.1);
      display: flex; align-items:center; justify-content:center;
      font-size: 1.8rem;
    }
    .he-info h3 { margin-bottom: 4px; font-size: 1.2rem; }
    .he-info .meta { font-size: 0.85rem; color: var(--text-muted); display:flex; gap: 1rem; }
    
    .he-side { text-align: right; }
    .he-price { font-size: 1.5rem; font-weight: 800; color: var(--green-500); }
    .he-status { margin-top: 4px; }

    .he-details {
      grid-column: 1 / -1;
      border-top: 1px solid var(--border);
      margin-top: var(--sp-4);
      padding-top: var(--sp-4);
      display: none;
    }
    .history-entry-card.expanded .he-details { display: block; }
    
    .logs-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-6);
    }
    .log-stack {
       background: rgba(0,0,0,0.2);
       padding: var(--sp-4);
       border-radius: var(--r-md);
       font-size: 0.8rem;
       max-height: 300px;
       overflow-y: auto;
    }
    .log-stack h4 { margin-bottom: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .log-line { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
    
    @media (max-width: 768px) {
      .history-entry-card { grid-template-columns: 1fr; text-align: center; }
      .he-icon { margin: 0 auto; }
      .he-side { text-align: center; }
      .logs-column { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="page-wrap">
  <div id="toast-container"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-brand">
      <a href="index.html" style="display:flex;align-items:center;gap:.75rem">
        <span class="leaf">🌿</span>
        <span class="appname">Agri<span>Negotiator</span></span>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="farmer_form.html">List Produce</a></li>
      <li><a href="simulation.html">Simulation</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="history.html" class="active">History</a></li>
    </ul>
    <div class="nav-cta">
      <!-- Injected by AuthGuard -->
    </div>
  </nav>

  <div class="history-container">
    <div class="history-hero">
      <h1 id="historyRoleTitle">My Deal History</h1>
      <p id="historySubtitle">Reviewing tracking, price convergence, and participant handshakes.</p>
    </div>

    <!-- Filter Control Bar (Test H4) -->
    <div class="card mb-8" style="padding:1.5rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; background:rgba(0,0,0,0.2); border-left:4px solid var(--green-500);">
        <div style="flex:1; min-width:150px;">
            <label style="font-size:0.7rem; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Status Filter</label>
            <select id="filterStatus" class="input" style="padding:0.4rem; height:auto; font-size:0.85rem;" onchange="applyFilters()">
                <option value="all">All Transactions</option>
                <option value="DEAL">Finalized Deals</option>
                <option value="PENDING_APPROVAL">Pending Signatures</option>
                <option value="ESCALATED_STORAGE">Warehouse Escallations</option>
                <option value="REJECTED">Rejected Bids</option>
            </select>
        </div>
        <div style="flex:1; min-width:150px;">
            <label style="font-size:0.7rem; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Crop Type</label>
            <input type="text" id="filterCrop" class="input" style="padding:0.4rem; height:auto; font-size:0.85rem;" placeholder="e.g. Tomato" oninput="applyFilters()">
        </div>
        <div style="flex:1; min-width:120px;">
            <label style="font-size:0.7rem; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Sort By</label>
            <select id="filterSort" class="input" style="padding:0.4rem; height:auto; font-size:0.85rem;" onchange="applyFilters()">
                <option value="recent">Most Recent First</option>
                <option value="price_high">Highest Price</option>
                <option value="qty_high">Largest Volume</option>
            </select>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="margin-top:1rem;">Reset</button>
    </div>

    <div class="history-list" id="historyList">
      <!-- Loading State -->
      <div class="card flex-center" style="padding: 5rem;">
         <div class="dot dot-green" style="margin-right:1rem"></div>
         <span>Retrieving immutable transaction records from NodeHub...</span>
      </div>
    </div>
  </div>

  <footer class="footer">
    🌿 AgriNegotiator &mdash; AI Supply Chain Platform &mdash;
    <a href="index.html">Home</a> &middot;
    <a href="dashboard.html">Dashboard</a>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
